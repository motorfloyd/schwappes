<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schwappes Price Checker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --coles-red: #D00F2D;
      --woolies-green: #008A35;
      --bg: #f5f4f0;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.1);
      --text: #1a1a1a;
      --muted: #6b6b6b;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1a1a1a; --surface: #252525; --border: rgba(255,255,255,0.1); --text: #f0ede8; --muted: #999; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    header { text-align: center; padding: 3rem 1rem 2rem; }
    header h1 { font-family: 'DM Serif Display', serif; font-size: clamp(28px, 5vw, 42px); font-weight: 400; letter-spacing: -0.5px; }
    header p { color: var(--muted); margin-top: 8px; font-size: 15px; }

    .search-wrap { max-width: 560px; margin: 0 auto 2.5rem; padding: 0 1rem; display: flex; gap: 8px; }
    .search-wrap input {
      flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-family: 'DM Sans', sans-serif;
      font-size: 15px; outline: none; transition: border-color 0.15s;
    }
    .search-wrap input:focus { border-color: var(--text); }
    .search-wrap button {
      padding: 12px 22px; border-radius: 10px; border: none; background: var(--text);
      color: var(--bg); font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500;
      cursor: pointer; white-space: nowrap; transition: opacity 0.15s;
    }
    .search-wrap button:hover { opacity: 0.8; }
    .search-wrap button:disabled { opacity: 0.4; cursor: not-allowed; }

    #winnerBar { max-width: 760px; margin: 0 auto 1.5rem; padding: 0 1rem; display: none; }
    .winner-inner {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 18px; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 10px;
    }
    .winner-inner strong { color: var(--text); }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 760px; margin: 0 auto; padding: 0 1rem 3rem; }
    @media (max-width: 540px) { .grid { grid-template-columns: 1fr; } }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .card-header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .store-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .card-header h2 { font-size: 15px; font-weight: 500; }

    .product { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
    .product:last-child { border-bottom: none; }
    .product-img { width: 52px; height: 52px; object-fit: contain; border-radius: 6px; background: #f0ede8; flex-shrink: 0; }
    .product-img-placeholder { width: 52px; height: 52px; border-radius: 6px; background: var(--bg); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .product-info { flex: 1; min-width: 0; }
    .product-name { font-size: 13px; color: var(--muted); line-height: 1.35; margin-bottom: 5px; }
    .product-price-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .price-now { font-size: 20px; font-weight: 500; }
    .price-was { font-size: 13px; color: var(--muted); text-decoration: line-through; }
    .unit-price { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .badge { display: inline-block; font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 99px; margin-top: 4px; }
    .badge-sale { background: #ffeaea; color: #a32d2d; }
    .badge-special { background: #e1f5ee; color: #0f6e56; }
    .product-link { font-size: 11px; color: var(--muted); text-decoration: none; margin-top: 4px; display: inline-block; }
    .product-link:hover { text-decoration: underline; }

    .state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2.5rem 1rem; gap: 10px; color: var(--muted); font-size: 13px; text-align: center; }
    .spinner { width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--muted); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .blocked-box { margin: 14px; padding: 14px 16px; background: #fffbf0; border: 1px solid #f0d080; border-radius: 10px; font-size: 13px; color: #7a6010; line-height: 1.6; }
    .blocked-box p { margin-bottom: 10px; }
    .blocked-box a {
      display: inline-block; padding: 7px 14px; border-radius: 7px; font-weight: 500;
      text-decoration: none; font-size: 13px; border: 1px solid currentColor;
    }
    .error-box { margin: 14px; padding: 12px 14px; background: #fff6f6; border: 1px solid #f7c1c1; border-radius: 8px; font-size: 13px; color: #a32d2d; }
  </style>
</head>
<body>

<header>
  <h1>Schwappes Price Checker</h1>
  <p>Live prices from Coles &amp; Woolworths</p>
</header>

<div class="search-wrap">
  <input type="text" id="searchTerm" value="Schweppes ginger ale" placeholder="Search for a product…" />
  <button id="searchBtn" onclick="fetchPrices()">Check prices</button>
</div>

<div id="winnerBar">
  <div class="winner-inner">
    <span>🏆</span>
    <span id="winnerText"></span>
  </div>
</div>

<div class="grid">
  <div class="card">
    <div class="card-header">
      <div class="store-dot" style="background:#D00F2D"></div>
      <h2>Coles</h2>
    </div>
    <div id="colesResults" class="state">Enter a search term and hit "Check prices"</div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="store-dot" style="background:#008A35"></div>
      <h2>Woolworths</h2>
    </div>
    <div id="wooliesResults" class="state">Enter a search term and hit "Check prices"</div>
  </div>
</div>

<script>
  function loading() {
    return '<div class="state"><div class="spinner"></div><span>Fetching prices…</span></div>';
  }

  function renderProducts(data, store) {
    // Blocked by bot protection
    if (data.blocked) {
      const storeName = store === 'coles' ? 'Coles' : 'Woolworths';
      const color = store === 'coles' ? '#D00F2D' : '#008A35';
      return `<div class="blocked-box">
        <p>⚠️ ${storeName} is blocking automated requests from this server's IP address.<br>
        Click below to check the price directly on their website.</p>
        <a href="${data.searchUrl}" target="_blank" style="color:${color}">Search on ${storeName} →</a>
      </div>`;
    }

    if (data.error && !data.blocked) {
      return `<div class="error-box">${data.error}</div>`;
    }

    const products = data.products || [];
    if (!products.length) {
      return '<div class="state">No results found</div>';
    }

    return products.map(p => {
      const price = p.price != null ? `$${Number(p.price).toFixed(2)}` : '—';
      const wasHtml = p.wasPrice ? `<span class="price-was">$${Number(p.wasPrice).toFixed(2)}</span>` : '';
      const badge = p.isSpecial ? '<span class="badge badge-special">Special</span>'
        : (p.wasPrice ? '<span class="badge badge-sale">Was price</span>' : '');
      const img = p.imageUrl
        ? `<img class="product-img" src="${p.imageUrl}" alt="" loading="lazy" onerror="this.style.display='none'" />`
        : `<div class="product-img-placeholder">🥤</div>`;
      const link = p.url ? `<a class="product-link" href="${p.url}" target="_blank">View on site →</a>` : '';
      const unit = p.unitPrice ? `<div class="unit-price">${p.unitPrice}</div>` : '';
      return `<div class="product">
        ${img}
        <div class="product-info">
          <div class="product-name">${p.name}${p.size ? ` · ${p.size}` : ''}</div>
          <div class="product-price-row"><span class="price-now">${price}</span>${wasHtml}</div>
          ${unit}${badge}${link}
        </div>
      </div>`;
    }).join('');
  }

  function updateWinner(colesData, wooliesData) {
    const bar = document.getElementById('winnerBar');
    if (colesData.blocked || wooliesData.blocked) { bar.style.display = 'none'; return; }
    const c = (colesData.products || []).find(p => p.price != null);
    const w = (wooliesData.products || []).find(p => p.price != null);
    if (!c || !w) { bar.style.display = 'none'; return; }
    const cp = Number(c.price), wp = Number(w.price);
    const diff = Math.abs(cp - wp).toFixed(2);
    let msg;
    if (cp < wp) msg = `<strong>Coles</strong> is cheaper by <strong>$${diff}</strong> on the top result`;
    else if (wp < cp) msg = `<strong>Woolworths</strong> is cheaper by <strong>$${diff}</strong> on the top result`;
    else msg = `Same price at both stores`;
    document.getElementById('winnerText').innerHTML = msg;
    bar.style.display = 'block';
  }

  async function fetchPrices() {
    const q = document.getElementById('searchTerm').value.trim();
    if (!q) return;
    document.getElementById('colesResults').innerHTML = loading();
    document.getElementById('wooliesResults').innerHTML = loading();
    document.getElementById('winnerBar').style.display = 'none';
    document.getElementById('searchBtn').disabled = true;

    const [colesRes, wooliesRes] = await Promise.allSettled([
      fetch(`/api/coles?q=${encodeURIComponent(q)}`).then(r => r.json()),
      fetch(`/api/woolworths?q=${encodeURIComponent(q)}`).then(r => r.json()),
    ]);

    const colesData = colesRes.status === 'fulfilled' ? colesRes.value : { error: colesRes.reason?.message, products: [] };
    const wooliesData = wooliesRes.status === 'fulfilled' ? wooliesRes.value : { error: wooliesRes.reason?.message, products: [] };

    document.getElementById('colesResults').innerHTML = renderProducts(colesData, 'coles');
    document.getElementById('wooliesResults').innerHTML = renderProducts(wooliesData, 'woolies');
    updateWinner(colesData, wooliesData);
    document.getElementById('searchBtn').disabled = false;
  }

  document.getElementById('searchTerm').addEventListener('keydown', e => {
    if (e.key === 'Enter') fetchPrices();
  });
</script>
</body>
</html>
