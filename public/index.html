<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schwappes</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --cream: #f5f0e8; --ink: #1a1510; --muted: #7a7060;
      --coles: #D00F2D; --woolies: #008A35; --other: #4a6fa5;
      --surface: #ffffff; --border: rgba(26,21,16,0.12);
      --accent: #c8a04a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; }

    /* HEADER */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px; background: var(--cream);
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-family: 'Playfair Display', serif; font-size: 22px; letter-spacing: -0.3px; }
    .logo span { color: var(--accent); }
    .header-actions { display: flex; gap: 10px; }

    /* LAYOUT */
    main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* SUMMARY CARDS */
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-bottom: 2.5rem; }
    .product-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 1.25rem 1.5rem; cursor: pointer; transition: box-shadow 0.15s, transform 0.15s;
      position: relative;
    }
    .product-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); transform: translateY(-1px); }
    .product-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
    .card-name { font-family: 'Playfair Display', serif; font-size: 17px; margin-bottom: 4px; }
    .card-size { font-size: 12px; color: var(--muted); margin-bottom: 14px; font-family: 'DM Mono', monospace; }
    .card-prices { display: flex; gap: 12px; flex-wrap: wrap; }
    .store-price { display: flex; flex-direction: column; gap: 2px; }
    .store-label { font-size: 10px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
    .store-amount { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 500; }
    .store-date { font-size: 10px; color: var(--muted); }
    .winner-badge {
      position: absolute; top: 14px; right: 14px;
      font-size: 10px; font-weight: 500; padding: 3px 8px;
      border-radius: 99px; letter-spacing: 0.3px;
    }
    .card-footer { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .card-entry-count { font-size: 11px; color: var(--muted); }
    .card-actions { display: flex; gap: 6px; }

    /* DETAIL PANEL */
    #detailPanel { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; margin-bottom: 2.5rem; }
    #detailPanel.visible { display: block; }
    .panel-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; }
    .panel-title { font-family: 'Playfair Display', serif; font-size: 22px; }
    .panel-subtitle { font-size: 13px; color: var(--muted); margin-top: 3px; font-family: 'DM Mono', monospace; }
    .panel-body { display: grid; grid-template-columns: 1fr 340px; gap: 2rem; }
    @media (max-width: 700px) { .panel-body { grid-template-columns: 1fr; } }

    /* CHART */
    .chart-wrap { position: relative; height: 240px; }

    /* HISTORY TABLE */
    .history-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .history-table th { text-align: left; padding: 8px 10px; font-size: 10px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
    .history-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
    .history-table tr:last-child td { border-bottom: none; }
    .history-table tr:hover td { background: var(--cream); }
    .store-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

    /* LOG FORM */
    .log-form { background: var(--cream); border-radius: 10px; padding: 1.25rem; }
    .log-form h3 { font-family: 'Playfair Display', serif; font-size: 16px; margin-bottom: 1rem; }
    .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .form-row label { font-size: 11px; font-weight: 500; letter-spacing: 0.4px; text-transform: uppercase; color: var(--muted); }
    .form-row input, .form-row select, .form-row textarea {
      padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); font-family: 'DM Sans', sans-serif; font-size: 14px;
      color: var(--ink); outline: none; transition: border-color 0.15s;
    }
    .form-row input:focus, .form-row select:focus { border-color: var(--accent); }
    .form-row textarea { resize: vertical; min-height: 60px; }

    /* BUTTONS */
    .btn { padding: 9px 18px; border-radius: 8px; border: none; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.82; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--ink); color: var(--cream); }
    .btn-accent { background: var(--accent); color: var(--surface); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--ink); }
    .btn-danger { background: transparent; border: 1px solid #e0a0a0; color: #c04040; }
    .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }

    /* EMPTY STATE */
    .empty { text-align: center; padding: 4rem 2rem; color: var(--muted); }
    .empty-icon { font-size: 48px; margin-bottom: 1rem; }
    .empty h2 { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--ink); margin-bottom: 8px; }
    .empty p { font-size: 14px; line-height: 1.6; margin-bottom: 1.5rem; }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal { background: var(--surface); border-radius: 14px; padding: 1.75rem; width: 420px; max-width: 95vw; transform: translateY(10px); transition: transform 0.2s; }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal h2 { font-family: 'Playfair Display', serif; font-size: 20px; margin-bottom: 1.25rem; }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; }

    /* ALERT */
    .alert { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--ink); color: var(--cream); padding: 12px 18px; border-radius: 10px; font-size: 14px; z-index: 300; transform: translateY(10px); opacity: 0; transition: all 0.25s; pointer-events: none; }
    .alert.show { transform: translateY(0); opacity: 1; }
    .alert.cheaper { background: var(--woolies); }
    .alert.more-expensive { background: #b04040; }

    /* STORE COLORS */
    .c-coles { color: var(--coles); }
    .c-woolworths { color: var(--woolies); }
    .c-other { color: var(--other); }
    .bg-coles { background: var(--coles); }
    .bg-woolworths { background: var(--woolies); }
    .bg-other { background: var(--other); }

    .section-title { font-family: 'Playfair Display', serif; font-size: 20px; margin-bottom: 1rem; display: flex; align-items: center; gap: 12px; }
    .section-title small { font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--muted); font-weight: 400; }
  </style>
</head>
<body>

<header>
  <div class="logo">Schwappes<span>.</span></div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" onclick="openAddProduct()">+ Add product</button>
  </div>
</header>

<main>
  <div id="summaryGrid" class="summary-grid"></div>
  <div id="detailPanel" class="detail-panel"></div>
  <div id="emptyState" style="display:none" class="empty">
    <div class="empty-icon">🥤</div>
    <h2>No products yet</h2>
    <p>Add a product like "Schweppes Ginger Ale" then log prices<br>as you spot them in Coles and Woolworths.</p>
    <button class="btn btn-accent" onclick="openAddProduct()">Add your first product</button>
  </div>
</main>

<!-- Add product modal -->
<div class="modal-overlay" id="addProductModal">
  <div class="modal">
    <h2>Add product</h2>
    <div class="form-row"><label>Product name</label><input id="newProductName" placeholder="e.g. Schweppes Ginger Ale" /></div>
    <div class="form-row"><label>Size / variant</label><input id="newProductSize" placeholder="e.g. 1.25L, 10-pack, 375mL" /></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('addProductModal')">Cancel</button>
      <button class="btn btn-primary" onclick="addProduct()">Add product</button>
    </div>
  </div>
</div>

<div class="alert" id="alert"></div>

<script>
let state = { summary: [], activeProductId: null, entries: [], chart: null };

// --- API ---
const api = {
  get: url => fetch(url).then(r => r.json()),
  post: (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json()),
  del: url => fetch(url, { method: 'DELETE' }).then(r => r.json()),
};

// --- INIT ---
async function init() { await refreshSummary(); }

async function refreshSummary() {
  state.summary = await api.get('/api/summary');
  renderSummary();
  if (state.activeProductId) {
    const item = state.summary.find(s => s.product.id === state.activeProductId);
    if (item) await openDetail(state.activeProductId);
  }
}

// --- SUMMARY ---
function storeColor(store) {
  return store === 'coles' ? 'var(--coles)' : store === 'woolworths' ? 'var(--woolies)' : 'var(--other)';
}
function storeName(store) {
  return store === 'coles' ? 'Coles' : store === 'woolworths' ? 'Woolworths' : store;
}
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: '2-digit' });
}

function renderSummary() {
  const grid = document.getElementById('summaryGrid');
  const empty = document.getElementById('emptyState');

  if (!state.summary.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = state.summary.map(({ product, byStore, cheapest, entryCount }) => {
    const stores = Object.entries(byStore);
    const pricesHtml = stores.length ? stores.map(([store, e]) => `
      <div class="store-price">
        <span class="store-label" style="color:${storeColor(store)}">${storeName(store)}</span>
        <span class="store-amount">$${e.price.toFixed(2)}</span>
        <span class="store-date">${fmtDate(e.date)}</span>
      </div>`).join('') :
      `<span style="font-size:13px;color:var(--muted)">No prices logged yet</span>`;

    const winnerBadge = cheapest && stores.length > 1 ? `
      <div class="winner-badge" style="background:${storeColor(cheapest.store)};color:#fff">
        ${storeName(cheapest.store)} cheaper
      </div>` : '';

    const savings = stores.length > 1
      ? (() => { const vals = stores.map(([,e]) => e.price); const diff = Math.max(...vals) - Math.min(...vals); return diff > 0 ? `Save $${diff.toFixed(2)}` : 'Same price'; })()
      : '';

    return `<div class="product-card ${state.activeProductId === product.id ? 'active' : ''}" onclick="openDetail(${product.id})">
      ${winnerBadge}
      <div class="card-name">${product.name}</div>
      <div class="card-size">${product.size || 'No size specified'}</div>
      <div class="card-prices">${pricesHtml}</div>
      <div class="card-footer">
        <span class="card-entry-count">${entryCount} price log${entryCount !== 1 ? 's' : ''}${savings ? ' · ' + savings : ''}</span>
        <div class="card-actions">
          <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();deleteProduct(${product.id})">Delete</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// --- DETAIL PANEL ---
async function openDetail(productId) {
  state.activeProductId = productId;
  const item = state.summary.find(s => s.product.id === productId);
  if (!item) return;

  state.entries = await api.get(`/api/entries?productId=${productId}`);
  const panel = document.getElementById('detailPanel');
  panel.className = 'visible';

  const stores = ['coles', 'woolworths', 'other'];
  const storeOptions = stores.map(s => `<option value="${s}">${storeName(s)}</option>`).join('');

  panel.innerHTML = `
    <div class="panel-header">
      <div>
        <div class="panel-title">${item.product.name}</div>
        <div class="panel-subtitle">${item.product.size || 'No size'}</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="closeDetail()">Close ✕</button>
    </div>
    <div class="panel-body">
      <div>
        <div class="section-title">Price history <small>${state.entries.length} entries</small></div>
        <div class="chart-wrap"><canvas id="priceChart"></canvas></div>
        <br>
        <table class="history-table">
          <thead><tr><th>Date</th><th>Store</th><th>Price</th><th>Note</th><th></th></tr></thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
      <div>
        <div class="log-form">
          <h3>Log a price</h3>
          <div class="form-row"><label>Store</label>
            <select id="logStore">${storeOptions}</select>
          </div>
          <div class="form-row"><label>Price ($)</label>
            <input type="number" id="logPrice" step="0.01" min="0" placeholder="2.50" />
          </div>
          <div class="form-row"><label>Date</label>
            <input type="date" id="logDate" value="${new Date().toISOString().split('T')[0]}" />
          </div>
          <div class="form-row"><label>Note (optional)</label>
            <textarea id="logNote" placeholder="On special, half price, etc."></textarea>
          </div>
          <button class="btn btn-accent" style="width:100%" onclick="logPrice(${productId})">Log price</button>
        </div>
      </div>
    </div>`;

  renderHistory();
  renderChart(item.product.name);
  renderSummary(); // re-render to update active state
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeDetail() {
  state.activeProductId = null;
  document.getElementById('detailPanel').className = '';
  renderSummary();
}

function renderHistory() {
  const tbody = document.getElementById('historyBody');
  if (!tbody) return;
  if (!state.entries.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:1.5rem">No entries yet — log your first price →</td></tr>';
    return;
  }
  tbody.innerHTML = state.entries.map(e => `
    <tr>
      <td style="font-family:'DM Mono',monospace;font-size:12px">${fmtDate(e.date)}</td>
      <td><span class="store-dot bg-${e.store}"></span>${storeName(e.store)}</td>
      <td style="font-family:'DM Mono',monospace;font-weight:500">$${e.price.toFixed(2)}</td>
      <td style="color:var(--muted);font-size:12px">${e.note || '—'}</td>
      <td><button class="btn btn-danger btn-sm" onclick="deleteEntry(${e.id})">×</button></td>
    </tr>`).join('');
}

function renderChart(productName) {
  if (state.chart) { state.chart.destroy(); state.chart = null; }
  const canvas = document.getElementById('priceChart');
  if (!canvas || !state.entries.length) return;

  const stores = [...new Set(state.entries.map(e => e.store))];
  const colors = { coles: '#D00F2D', woolworths: '#008A35', other: '#4a6fa5' };

  const datasets = stores.map(store => {
    const storeEntries = state.entries
      .filter(e => e.store === store)
      .sort((a, b) => new Date(a.date) - new Date(b.date));
    return {
      label: storeName(store),
      data: storeEntries.map(e => ({ x: e.date, y: e.price })),
      borderColor: colors[store] || '#666',
      backgroundColor: (colors[store] || '#666') + '20',
      tension: 0.3,
      pointRadius: 5,
      pointHoverRadius: 7,
      fill: false,
    };
  });

  state.chart = new Chart(canvas, {
    type: 'line',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { font: { family: 'DM Sans' }, boxWidth: 12 } },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: $${ctx.parsed.y.toFixed(2)}`,
          }
        }
      },
      scales: {
        x: { type: 'time', time: { unit: 'day', displayFormats: { day: 'd MMM' } }, grid: { color: 'rgba(0,0,0,0.05)' } },
        y: { ticks: { callback: v => '$' + v.toFixed(2) }, grid: { color: 'rgba(0,0,0,0.05)' } },
      }
    }
  });
}

// --- ACTIONS ---
async function logPrice(productId) {
  const store = document.getElementById('logStore').value;
  const price = parseFloat(document.getElementById('logPrice').value);
  const date = document.getElementById('logDate').value;
  const note = document.getElementById('logNote').value;

  if (!price || isNaN(price)) { showAlert('Enter a valid price', ''); return; }

  // Check if cheaper than previous entries for this store
  const prevForStore = state.entries.filter(e => e.store === store);
  const prevLatest = prevForStore.sort((a, b) => new Date(b.date) - new Date(a.date))[0];

  await api.post('/api/entries', { productId, store, price, date, note });

  if (prevLatest && price < prevLatest.price) {
    showAlert(`📉 Cheaper at ${storeName(store)}! $${prevLatest.price.toFixed(2)} → $${price.toFixed(2)}`, 'cheaper');
  } else if (prevLatest && price > prevLatest.price) {
    showAlert(`📈 Price up at ${storeName(store)}: $${prevLatest.price.toFixed(2)} → $${price.toFixed(2)}`, 'more-expensive');
  } else {
    showAlert('Price logged ✓', '');
  }

  document.getElementById('logPrice').value = '';
  document.getElementById('logNote').value = '';
  await refreshSummary();
}

async function deleteEntry(id) {
  await api.del(`/api/entries/${id}`);
  await refreshSummary();
}

async function deleteProduct(id) {
  if (!confirm('Delete this product and all its price history?')) return;
  await api.del(`/api/products/${id}`);
  if (state.activeProductId === id) closeDetail();
  await refreshSummary();
}

function openAddProduct() {
  document.getElementById('addProductModal').classList.add('open');
  document.getElementById('newProductName').focus();
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

async function addProduct() {
  const name = document.getElementById('newProductName').value.trim();
  const size = document.getElementById('newProductSize').value.trim();
  if (!name) return;
  const product = await api.post('/api/products', { name, size });
  closeModal('addProductModal');
  document.getElementById('newProductName').value = '';
  document.getElementById('newProductSize').value = '';
  await refreshSummary();
  await openDetail(product.id);
}

function showAlert(msg, type) {
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.className = 'alert show' + (type ? ' ' + type : '');
  setTimeout(() => el.className = 'alert', 3000);
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal('addProductModal');
    closeDetail();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openAddProduct(); }
});

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
});

// Add Chart.js date adapter
const script = document.createElement('script');
script.src = 'https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js';
script.onload = init;
document.head.appendChild(script);
</script>
</body>
</html>
